version: "3.9"

# Prototype topology for the Distributed Document Search Service.
# Single-node ES + single-node Redis are intentional shortcuts; ARCHITECTURE.md
# documents the production multi-node evolution.

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    container_name: dss-es
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - cluster.name=dss-cluster
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health | grep -E '\"status\":\"(green|yellow)\"'"]
      interval: 5s
      timeout: 3s
      retries: 30
    volumes:
      - es-data:/usr/share/elasticsearch/data

  redis:
    image: redis:7.2-alpine
    container_name: dss-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - redis-data:/data

  api:
    build: .
    container_name: dss-api
    environment:
      - ES_URL=http://elasticsearch:9200
      - REDIS_URL=redis://redis:6379/0
      - INDEX_NAME=documents
      - SEARCH_CACHE_TTL=60
      - DOC_CACHE_TTL=300
      - RATE_LIMIT_RPS=${RATE_LIMIT_RPS:-50}
      - RATE_LIMIT_BURST=${RATE_LIMIT_BURST:-100}
      - LOG_LEVEL=INFO
    depends_on:
      elasticsearch:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    command: ["uvicorn", "app.api.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "2"]

  indexer:
    build: .
    container_name: dss-indexer
    environment:
      - ES_URL=http://elasticsearch:9200
      - REDIS_URL=redis://redis:6379/0
      - INDEX_NAME=documents
      - LOG_LEVEL=INFO
    depends_on:
      elasticsearch:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["python", "-m", "app.indexer.worker"]

volumes:
  es-data:
  redis-data:
